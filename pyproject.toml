[project]
name = "tooth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.10.1",
    "fastapi>=0.135.2",
    "nibabel>=5.4.2",
    "onnxruntime>=1.24.4",
    "pydantic>=2.0",
    # DICOM reading (backend/dicom). pydicom 3 changed the pixel-decoding API;
    # move deliberately. python-gdcm decodes JPEG, JPEG-LS and JPEG 2000 slices.
    "pydicom>=2.4,<3",
    "python-gdcm>=3.0.20",
    "python-multipart>=0.0.6",
    "scipy>=1.17.1",
    "sqlalchemy>=2.0.48",
    "uvicorn[standard]>=0.42.0",
]

[tool.setuptools.packages.find]
where = ["packages/prototyping", "packages/application"]

[tool.pytest.ini_options]
pythonpath = ["packages/prototyping", "packages/application"]
testpaths = ["packages/application/tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
]
